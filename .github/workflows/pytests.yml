name: Theiagene Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/theiagene/**'
      - 'tests/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/pytests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/theiagene/**'
      - 'tests/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/pytests.yml'

permissions:
  contents: read
  pull-requests: write   # required for the coverage comment

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]" pytest-cov

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=src/theiagene --cov-report "xml:coverage.xml" --cov-report=term-missing:skip-covered --junitxml=junit.xml

    - name: Coverage comment
      uses: MishaKav/pytest-coverage-comment@v1.12.2
      with:
        pytest-xml-coverage-path: ./coverage.xml
        junitxml-path: ./junit.xml
